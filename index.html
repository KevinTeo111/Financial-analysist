<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consolidado de resultados · Demo con datos ficticios</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --chip:#f0efec;
  --s1:#2a78d6; --s1-soft:#86b6ef; --s2:#eb6834;
  --pos:#2a78d6; --neg:#e34948; --up:#006300; --down:#d03b3b;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --wash:rgba(42,120,214,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --chip:#383835;
    --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
    --pos:#3987e5; --neg:#e66767; --up:#0ca30c; --down:#e66767;
    --wash:rgba(57,135,229,.14);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 40px}
.demo-band{background:var(--chip);color:var(--ink2);font-size:12.5px;text-align:center;padding:6px 12px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 10px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:650}
header.top .sub{color:var(--ink2);font-size:13px}
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 0 14px;border-bottom:1px solid var(--border)}
.filters label{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;margin:14px 0 16px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:550}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--border)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--chip);font-size:11.5px;text-align:center}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:12px;flex-wrap:wrap}
.crumbs a{color:var(--s1);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h2{font-size:14.5px;margin:0 0 2px;font-weight:620}
.card .hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.tile:hover{box-shadow:0 0 0 2px var(--wash)}
.tile .lbl{color:var(--ink2);font-size:12.5px}
.tile .val{font-size:24px;font-weight:650;margin:2px 0}
.tile .val small{font-size:12px;color:var(--muted);font-weight:500}
.tile .dl{font-size:12.5px}
.up{color:var(--up)} .down{color:var(--down)}
.alertbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--serious);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.alertbar a{color:var(--s1);cursor:pointer;margin-left:auto;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .base{stroke:var(--axis);stroke-width:1}
svg .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg .lab{fill:var(--ink2);font-size:12px}
svg .val{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
svg .bar{fill:var(--s1)}
svg .bar-soft{fill:var(--s1-soft)}
svg .prevtick{stroke:var(--ink2);stroke-width:2}
svg .hit{fill:transparent;cursor:pointer}
svg .row:hover .hit,svg .hitcol:hover .hit{fill:var(--wash)}
svg .ln1{fill:none;stroke:var(--s1);stroke-width:2}
svg .ln2{fill:none;stroke:var(--s2);stroke-width:2}
svg .xh{stroke:var(--axis);stroke-width:1;opacity:0}
svg .hitcol:hover .xh,svg .hitcol:focus .xh{opacity:1}
svg .dot{opacity:0}
svg .hitcol:hover .dot{opacity:1}
svg .flag{fill:var(--crit);stroke:var(--surface);stroke-width:2}
svg .flagtxt{fill:#fff;font-size:10px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:0 0 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.sq{width:10px;height:10px;border-radius:3px}
.legend i.tk{width:2px;height:12px;border-radius:0;background:var(--ink2)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.ind{padding-left:22px;color:var(--ink2)}
tr.t1 td{font-weight:620}
tr.t2 td{font-weight:700;border-top:1px solid var(--axis)}
tr.pct td{color:var(--muted);font-size:12.5px}
td.cell{cursor:pointer;position:relative}
td.cell:hover{background:var(--wash)}
td.cell.note::after{content:"";position:absolute;top:3px;right:2px;border-left:6px solid transparent;border-top:6px solid var(--s2)}
td.cur{background:color-mix(in srgb,var(--wash) 50%,transparent)}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--wash)}
.tablewrap{overflow-x:auto}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.st .ic{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10.5px;font-weight:700;color:#fff}
.st.ok .ic{background:var(--good)} .st.warn .ic{background:var(--warn);color:#0b0b0b} .st.fail .ic{background:var(--crit)} .st.serious .ic{background:var(--serious)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--s1);color:#fff;border-color:transparent}
.btn:hover{box-shadow:0 0 0 2px var(--wash)}
.erpcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media (max-width:820px){.erpcards{grid-template-columns:1fr}}
.erpcards .card h3{margin:0;font-size:15px}
.erpcards .meta{color:var(--ink2);font-size:12.5px;margin-top:4px}
.log{font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--chip);border-radius:8px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.divbar{position:relative;height:12px;width:150px;display:inline-block;vertical-align:middle}
.divbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.divbar span{position:absolute;top:0;height:12px;border-radius:0 4px 4px 0}
.divbar span.n{border-radius:4px 0 0 4px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s ease;z-index:20;overflow-y:auto;padding:18px 20px 30px}
.drawer.open{transform:none}
.drawer .x{position:absolute;top:12px;right:12px}
.drawer h2{font-size:16px;margin:0 30px 2px 0}
.drawer .big{font-size:28px;font-weight:650;margin:8px 0 2px}
.drawer section{margin-top:18px}
.drawer h3{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:620;text-transform:uppercase;letter-spacing:.03em}
.note-auto{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:13px}
.note-user{border-left:3px solid var(--s2);padding:6px 10px;margin:6px 0;font-size:13px}
.note-user small{color:var(--muted)}
textarea{width:100%;min-height:62px;border:1px solid var(--border);border-radius:8px;background:var(--page);padding:8px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:7px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;max-width:280px}
#tip b{font-weight:620}
.muted{color:var(--muted)}
.small{font-size:12.5px}
footer{color:var(--muted);font-size:12px;margin-top:26px;text-align:center}
.pill{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.unm td{background:color-mix(in srgb,var(--serious) 10%,transparent)}
</style>
</head>
<body>
<div class="demo-band">Demo con datos ficticios: 16 empresas, 7 áreas, 3 ERP. Nombres, cifras y asignaciones son ilustrativos.</div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Consolidado de resultados del grupo</h1>
      <div class="sub">Cifras en MM$ · Último cierre cargado: septiembre 2026</div>
    </div>
  </header>

  <div class="filters" role="toolbar" aria-label="Filtros">
    <label>Ver <select id="fScope"></select></label>
    <label>Acumulado <select id="fCut"></select></label>
    <label>Valores <span class="seg" id="fReal"><button data-v="0">Nominales</button><button data-v="1">Reales (IPC)</button></span></label>
    <label>Operaciones entre empresas <span class="seg" id="fElim"><button data-v="1">Eliminar</button><button data-v="0">Incluir</button></span></label>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <footer>Maqueta de demostración. Todos los datos son ficticios y se generan en el navegador.</footer>
</div>

<aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1"></aside>
<div id="tip" hidden></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261111);
const noise=a=>1+(R()*2-1)*a;
const nf0=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const fmt=v=>(v<-0.5?'−':'')+nf0.format(Math.abs(Math.round(v)));
const pct=v=>isFinite(v)?(v*100).toFixed(1).replace('.',',')+'%':'—';
const dpct=(a,b)=>(b===0||!isFinite(b))?NaN:(a-b)/Math.abs(b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=a=>{const s=a.reduce((x,y)=>x+y,0);return a.map(v=>v/s)};
function fmtAxis(v){const a=Math.abs(v);if(a>=1000){const k=a/1000;return (v<0?'−':'')+(Number.isInteger(k)?nf0.format(k):k.toFixed(1).replace('.',','))+' mil'}return fmt(v)}

const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const YEARS=[2022,2023,2024,2025,2026];
const CUR=2026, LASTCLOSE=9;
const IPC={2022:1.262,2023:1.148,2024:1.098,2025:1.042,2026:1};

const AREAS=[
  {id:'inm',name:'Inmobiliario'},{id:'res',name:'Restaurantes'},{id:'agr',name:'Agrícola'},
  {id:'pac',name:'Packing'},{id:'exp',name:'Exportadora'},{id:'inv',name:'Inversiones'},{id:'ser',name:'Servicios'}];
const ERPS={softland:'Softland',agrosoft:'Agrosoft',inet:'INet'};
const ERP_SRC={softland:'Lectura directa de la base (solo lectura)',agrosoft:'Exportación programada del libro mayor',inet:'Archivo Excel del libro mayor'};
const COMPANIES=[
  {id:'andes',name:'Inmobiliaria Los Andes',area:'inm',erp:'softland',S:4200},
  {id:'valle',name:'Rentas del Valle',area:'inm',erp:'softland',S:3100},
  {id:'costanera',name:'Inmobiliaria Costanera',area:'inm',erp:'softland',S:2600},
  {id:'centro',name:'Restaurantes Centro',area:'res',erp:'inet',S:3800},
  {id:'bosque',name:'Trattoria del Bosque',area:'res',erp:'inet',S:2200},
  {id:'sanpedro',name:'Agrícola San Pedro',area:'agr',erp:'agrosoft'},
  {id:'santaelena',name:'Agrícola Santa Elena',area:'agr',erp:'agrosoft'},
  {id:'robles',name:'Agrícola Los Robles',area:'agr',erp:'agrosoft'},
  {id:'rancagua',name:'Packing Rancagua',area:'pac',erp:'agrosoft'},
  {id:'pacifico',name:'Exportadora Pacífico Sur',area:'exp',erp:'agrosoft'},
  {id:'cordillera',name:'Inversiones Cordillera',area:'inv',erp:'softland',S:1600},
  {id:'maipo',name:'Inversiones Maipo',area:'inv',erp:'softland',S:1100},
  {id:'aconcagua',name:'Capital Aconcagua',area:'inv',erp:'softland',S:900},
  {id:'lagos',name:'Inversiones Los Lagos',area:'inv',erp:'softland',S:700},
  {id:'compartidos',name:'Servicios Compartidos',area:'ser',erp:'inet',S:850},
  {id:'logistica',name:'Logística Central',area:'ser',erp:'inet',S:1300}];
const CBY=Object.fromEntries(COMPANIES.map(c=>[c.id,c]));
const ABY=Object.fromEntries(AREAS.map(a=>[a.id,a]));

const BASE=['ventas','cto','rem','arr','gb','imp','vig','ogav','dep','gfin','onop'];
const ROWS=[
  {k:'ventas',n:'Ventas'},{k:'cto',n:'Costo de venta'},{k:'mb',n:'Margen bruto',t:1},{k:'mbp',n:'Margen bruto %',p:'mb'},
  {k:'rem',n:'Remuneraciones',ind:1},{k:'arr',n:'Arriendos',ind:1},{k:'gb',n:'Gastos básicos',ind:1},{k:'imp',n:'Impuestos y contribuciones',ind:1},
  {k:'vig',n:'Vigilancia',ind:1},{k:'ogav',n:'Otros GAV',ind:1},{k:'dep',n:'Depreciación',ind:1},
  {k:'gav',n:'Total GAV',t:1},{k:'gavp',n:'GAV %',p:'gav'},
  {k:'ro',n:'Resultado operacional',t:1},{k:'rop',n:'Resultado operacional %',p:'ro'},
  {k:'gfin',n:'Gastos financieros',ind:1},{k:'onop',n:'Otros ingresos y gastos',ind:1},{k:'rno',n:'Resultado no operacional',t:1},
  {k:'rai',n:'Resultado antes de impuesto',t:2},{k:'ebitda',n:'EBITDA',t:2},{k:'ebitdap',n:'EBITDA %',p:'ebitda'}];
const RN=Object.fromEntries(ROWS.map(r=>[r.k,r.n]));
const COMPONENTS={mb:['ventas','cto'],gav:['rem','arr','gb','imp','vig','ogav','dep'],ro:['mb','gav'],rno:['gfin','onop'],rai:['ro','rno'],ebitda:['ro','dep']};

/* ---------- generación de datos ficticios ---------- */
const FLAT=Array(12).fill(1/12);
const RES_SEAS=norm([.085,.08,.08,.078,.08,.078,.082,.08,.08,.085,.088,.114]);
const PROFILE={
  inm:{cto:.14,rem:.06,arr:0,gb:.03,imp:.07,vig:.03,ogav:.03,dep:.17,gfin:.11,onop:.01,g:1.05,season:FLAT},
  res:{cto:.37,rem:.26,arr:.09,gb:.05,imp:.01,vig:.006,ogav:.06,dep:.04,gfin:.012,onop:.003,g:1.07,season:RES_SEAS},
  agr:{cto:.58,rem:.07,arr:.01,gb:.02,imp:.006,vig:.004,ogav:.03,dep:.07,gfin:.03,onop:.004},
  pac:{cto:.66,rem:.08,arr:.01,gb:.04,imp:.004,vig:.004,ogav:.02,dep:.06,gfin:.02,onop:.002},
  exp:{cto:.86,rem:.02,arr:.002,gb:.003,imp:.001,vig:.001,ogav:.015,dep:.004,gfin:.012,onop:.006},
  inv:{cto:.08,rem:.05,arr:.01,gb:.005,imp:.01,vig:0,ogav:.03,dep:.01,gfin:.06,onop:.12,g:1.03,season:FLAT},
  ser:{cto:.18,rem:.46,arr:.05,gb:.03,imp:.005,vig:.01,ogav:.08,dep:.03,gfin:.01,onop:.002,g:1.06,season:FLAT}};
const PRODUCTS={cer:'Cerezas',car:'Carozos',nue:'Nueces',man:'Manzanas',per:'Peras'};
const PSEASON={
  cer:[.30,0,0,0,0,0,0,0,0,0,.20,.50], car:[.45,.35,.05,0,0,0,0,0,0,0,0,.15],
  nue:[0,0,.25,.45,.30,0,0,0,0,0,0,0], man:[0,.15,.35,.30,.15,.05,0,0,0,0,0,0], per:[.10,.35,.35,.15,.05,0,0,0,0,0,0,0]};
const MIX={ /* toneladas/año base, MM$ por tonelada */
  sanpedro:{cer:[520,4.6],nue:[300,3.2]},
  santaelena:{man:[2400,.55],per:[1300,.6],car:[600,1.3]},
  robles:{cer:[380,4.6],car:[450,1.3]},
  rancagua:{cer:[3800,.38],car:[2600,.22],man:[5200,.12],nue:[1500,.15]},
  pacifico:{cer:[2600,5.4],nue:[1600,3.6],man:[4800,.75],per:[2000,.8],car:[1900,1.6]}};
const PF={};
for(const p in PRODUCTS){let t=1,pr=1;PF[p]={};for(const y of YEARS){if(y>2022){t*=noise(.06);pr*=noise(.05)*1.03}PF[p][y]={t,p:pr}}}
PF.cer[2026]={t:PF.cer[2025].t*.86,p:PF.cer[2025].p*.72};
PF.nue[2026]={t:PF.nue[2025].t*1.17,p:PF.nue[2025].p*1.07};

const DATA={}, PROD={};
for(const c of COMPANIES){
  const pr=PROFILE[c.area]; const isP=!!MIX[c.id]; c.prod=isP;
  const Sb=isP?Object.values(MIX[c.id]).reduce((s,[t,p])=>s+t*p,0):c.S;
  DATA[c.id]={};PROD[c.id]={};
  YEARS.forEach((y,k)=>{
    DATA[c.id][y]=[];PROD[c.id][y]=[];
    const grow=Math.pow(1.045,k);
    for(let m=0;m<12;m++){
      const v={};
      if(isP){
        let sales=0,baseV=0;const pm={};
        for(const p in MIX[c.id]){const [t0,p0]=MIX[c.id][p];const tons=t0*PF[p][y].t*PSEASON[p][m]*noise(.03);const val=tons*p0*PF[p][y].p;pm[p]={t:tons,v:val};sales+=val;baseV+=tons*p0*Math.pow(1.035,k)}
        PROD[c.id][y][m]=pm;v.ventas=sales;v.cto=-pr.cto*baseV*noise(.03);
        v.gb=-pr.gb*Sb*grow/12*noise(.05);v.ogav=-pr.ogav*Sb*grow/12*noise(.05);
      }else{
        v.ventas=c.S*Math.pow(pr.g,k)*pr.season[m]*noise(.04);v.cto=-pr.cto*v.ventas*noise(.03);
        v.gb=-pr.gb*v.ventas*noise(.05);v.ogav=-pr.ogav*v.ventas*noise(.05);
      }
      v.rem=-pr.rem*Sb*grow/12*noise(.02);v.arr=-pr.arr*Sb*grow/12*noise(.01);v.imp=-pr.imp*Sb*grow/12*noise(.02);
      v.vig=-pr.vig*Sb*grow/12*noise(.02);v.dep=-pr.dep*Sb*grow/12*noise(.005);v.gfin=-pr.gfin*Sb/12*noise(.06);
      v.onop=pr.onop*Sb/12*(c.area==='inv'?(.4+R()*1.2):(R()*2-1));
      DATA[c.id][y][m]=v;
    }
  });
}
/* operaciones entre empresas del grupo */
const FLOWS=[
  {id:'f1',seller:'valle',buyer:'centro',concept:'Arriendo de locales',sl:'ventas',bl:'arr',amt:(y,m)=>22*Math.pow(1.04,y-2022)},
  {id:'f2',seller:'rancagua',buyer:'pacifico',concept:'Servicio de packing',sl:'ventas',bl:'cto',amt:(y,m)=>140*(PSEASON.cer[m]+PSEASON.car[m]+PSEASON.man[m])*Math.pow(1.05,y-2022)},
  {id:'f3',seller:'cordillera',buyer:'costanera',concept:'Intereses por préstamo',sl:'onop',bl:'gfin',amt:(y,m)=>11},
  {id:'f4',seller:'compartidos',buyer:'sanpedro',concept:'Servicios de administración',sl:'ventas',bl:'ogav',amt:(y,m)=>8*Math.pow(1.04,y-2022)}];
for(const f of FLOWS)for(const y of YEARS)for(let m=0;m<12;m++){const a=f.amt(y,m);DATA[f.seller][y][m][f.sl]+=a;DATA[f.buyer][y][m][f.bl]-=a}

function accCode(erp,line,i){const b=LCODE[line];

/* ---------- cálculo ---------- */
function compsIn(sc){if(sc.type==='group')return COMPANIES;if(sc.type==='area')return COMPANIES.filter(c=>c.area===sc.id);return [CBY[sc.id]]}
function scopeName(sc){return sc.type==='group'?'Grupo consolidado':sc.type==='area'?ABY[sc.id].name:CBY[sc.id].name}
function scopeKey(sc){return sc.type+':'+sc.id}
function sumRange(sc,y,m0,m1,opt){
  opt=opt||S;const ids=new Set(compsIn(sc).map(c=>c.id));const acc=Object.fromEntries(BASE.map(l=>[l,0]));
  for(const id of ids)for(let m=m0;m<m1;m++){const v=DATA[id][y][m];for(const l of BASE)acc[l]+=v[l]}
  for(const u of UNMAPPED)if(u.line&&ids.has(u.c)&&u.y===y&&u.m>=m0&&u.m<m1)acc[u.line]+=u.amt;
  if(opt.elim)for(const f of FLOWS)if(ids.has(f.seller)&&ids.has(f.buyer))for(let m=m0;m<m1;m++){const a=f.amt(y,m);acc[f.sl]-=a;acc[f.bl]+=a}
  if(opt.real)for(const l of BASE)acc[l]*=IPC[y];
  return stmt(acc)}
function stmt(b){const r={...b};r.mb=b.ventas+b.cto;r.gav=b.rem+b.arr+b.gb+b.imp+b.vig+b.ogav+b.dep;r.ro=r.mb+r.gav;r.rno=b.gfin+b.onop;r.rai=r.ro+r.rno;r.ebitda=r.ro-b.dep;
  r.mbp=r.mb/b.ventas;r.gavp=r.gav/b.ventas;r.rop=r.ro/b.ventas;r.ebitdap=r.ebitda/b.ventas;return r}
const ytd=(sc,y)=>sumRange(sc,y,0,S.cut);
function children(sc){
  if(sc.type==='group')return AREAS.map(a=>({type:'area',id:a.id}));
  if(sc.type==='area')return compsIn(sc).map(c=>({type:'company',id:c.id}));
  return []}
function accountRows(cid,line,y){
  const c=CBY[cid];const opt={...S,elim:false};
  let total=sumRange({type:'company',id:cid},y,0,S.cut,opt)[line];
  const extra=UNMAPPED.filter(u=>u.c===cid&&u.line===line&&u.y===y&&u.m<S.cut).map(u=>({code:u.code,name:u.name+' (asignada)',v:u.amt*(S.real?IPC[y]:1)}));
  const ex=extra.reduce((s,e)=>s+e.v,0);
  return ACCOUNTS[cid][line].map(a=>({code:a.code,name:a.name,v:(total-ex)*a.w})).concat(extra)}

/* controles de carga */
function controlsFor(c){
  const out=[];
  const empties=[];for(const y of YEARS)for(let m=0;m<(y===CUR?S.cut:12);m++){const v=DATA[c.id][y][m];if(BASE.every(l=>v[l]===0))empties.push(MONTHS[m]+' '+y)}
  out.push({k:'per',label:'Períodos completos',st:empties.length?'fail':'ok',detail:empties.length?`${empties.join(', ')} sin movimientos: la carga de ese mes no llegó completa.`:''});
  const d=INJ.dup.filter(x=>x.c===c.id&&(x.y<CUR||x.m<S.cut));
  out.push({k:'dup',label:'Sin duplicados',st:d.length?'fail':'ok',detail:d.length?d.map(x=>`${MONTHS[x.m]} ${x.y}: el mismo período se cargó dos veces.`).join(' '):''});
  const un=UNMAPPED.filter(u=>u.c===c.id&&!u.line);const unIn=un.filter(u=>u.y<CUR||u.m<S.cut);const diff=unIn.reduce((s,u)=>s+u.amt,0);
  out.push({k:'may',label:'Cuadra con el mayor del ERP',st:diff?'fail':'ok',detail:diff?`Diferencia de MM$ ${fmt(diff)} contra el mayor: hay movimientos en cuentas que no están asignadas a ninguna línea.`:''});
  out.push({k:'map',label:'Cuentas asignadas',st:un.length?'warn':'ok',detail:un.length?`${un.length} cuenta(s) del ERP sin línea asignada en la tabla de equivalencia.`:''});
  const s=INJ.sign.filter(x=>x.c===c.id&&(x.y<CUR||x.m<S.cut));
  out.push({k:'sig',label:'Signos coherentes',st:s.length?'warn':'ok',detail:s.length?s.map(x=>`${RN[x.l]} de ${MONTHS[x.m]} ${x.y} con signo contrario al habitual.`).join(' '):''});
  return out}
const RANK={ok:0,warn:1,fail:2};
function companyStatus(c){return controlsFor(c).reduce((w,x)=>RANK[x.st]>RANK[w]?x.st:w,'ok')}
function stHTML(st,label){const ic={ok:'✓',warn:'!',fail:'✕',serious:'!'}[st];return `<span class="st ${st}"><span class="ic" aria-hidden="true">${ic}</span>${esc(label)}</span>`}
const ST_LABEL={ok:'Correcto',warn:'Revisar',fail:'No cuadra'};

/* anomalías por comparación con el mismo mes de otros años */
function detectAnomalies(){
  const out=[];const LINES=BASE.filter(l=>l!=='onop');
  for(const c of COMPANIES)for(const y of [2025,2026])for(let m=0;m<(y===CUR?S.cut:12);m++){
    const hits=[];
    for(const l of LINES){const v=DATA[c.id][y][m][l];const others=YEARS.filter(o=>o!==y).map(o=>DATA[c.id][o][m][l]).filter(x=>x!==0);
      if(!others.length)continue;const mean=others.reduce((a,b)=>a+b,0)/others.length;const sd=Math.sqrt(others.reduce((a,b)=>a+(b-mean)**2,0)/others.length);
      const diff=v-mean;if(Math.abs(diff)>Math.max(3*sd,.45*Math.abs(mean),3))hits.push({l,v,mean,diff})}
    if(!hits.length)continue;
    let cause,st='serious';const ratios=hits.map(h=>h.v/h.mean);
    if(hits.every(h=>h.v===0)){cause='Mes sin movimientos: posible carga incompleta';st='fail'}
    else if(hits.length>=3&&ratios.every(r=>r>1.6&&r<2.7)){cause='Valores al doble de lo habitual: posible carga duplicada';st='fail'}
    else if(hits.some(h=>h.v*h.mean<0)){cause='Signo invertido: posible cuenta mal clasificada'}
    else if(c.prod&&hits.some(h=>h.l==='ventas')){cause='Cambio de precio o volumen: ver análisis precio / volumen'}
    else cause='Desviación inusual frente al mismo mes de otros años';
    out.push({c,y,m,hits,cause,st})}
  return out.sort((a,b)=>RANK[b.st==='serious'?'warn':b.st]-RANK[a.st==='serious'?'warn':a.st]||b.y-a.y||b.m-a.m)}

/* precio / volumen */
function priceVolume(sc,y){
  const rows={};const comps=compsIn(sc).filter(c=>c.prod);if(!comps.length)return null;
  for(const c of comps)for(const yy of [y-1,y])for(let m=0;m<S.cut;m++){const pm=PROD[c.id][yy][m];for(const p in pm){rows[p]=rows[p]||{p,t0:0,v0:0,t1:0,v1:0};if(yy===y){rows[p].t1+=pm[p].t;rows[p].v1+=pm[p].v}else{rows[p].t0+=pm[p].t;rows[p].v0+=pm[p].v}}}
  const list=Object.values(rows).filter(r=>r.v0||r.v1).map(r=>{const p0=r.t0?r.v0/r.t0:0,p1=r.t1?r.v1/r.t1:0;
    const vol=r.t0&&r.t1?(r.t1-r.t0)*p0:(r.v1-r.v0);const price=r.t0&&r.t1?(p1-p0)*r.t1:0;return {...r,p0,p1,vol,price}});
  const tot=list.reduce((a,r)=>({vol:a.vol+r.vol,price:a.price+r.price,v0:a.v0+r.v0,v1:a.v1+r.v1}),{vol:0,price:0,v0:0,v1:0});
  return {list:list.sort((a,b)=>Math.abs(b.vol+b.price)-Math.abs(a.vol+a.price)),tot}}

function autoNote(sc,line,y,marker){
  const parts=[];
  if(line==='ventas'&&y>2022){const pv=priceVolume(sc,y);
    if(pv&&Math.abs(pv.tot.v1-pv.tot.v0)>1){const top=pv.list[0];
      parts.push(`Ventas de fruta ${pv.tot.v1>=pv.tot.v0?'suben':'bajan'} MM$ ${fmt(Math.abs(pv.tot.v1-pv.tot.v0))} frente a ${y-1}: efecto precio ${fmt(pv.tot.price)}, efecto volumen ${fmt(pv.tot.vol)}. `+
        `Mayor impacto: ${PRODUCTS[top.p]} (precio ${fmt(top.price)}, volumen ${fmt(top.vol)}).`)}}
  const ids=new Set(compsIn(sc).map(c=>c.id));
  const an=ANOMS.filter(a=>ids.has(a.c.id)&&a.y===y&&a.hits.some(h=>h.l===line));
  if(an.length)parts.push(`Incluye ${an.length} alerta(s) de carga: `+an.slice(0,3).map(a=>`${a.c.name}, ${MONTHS[a.m]} ${a.y} (${a.cause.split(':')[0].toLowerCase()})`).join('; ')+'.');
  if(!marker&&S.elim&&sc.type!=='company'){const fl=FLOWS.filter(f=>ids.has(f.seller)&&ids.has(f.buyer)&&(f.sl===line||f.bl===line));
    if(fl.length)parts.push(`Se eliminan operaciones entre empresas: ${fl.map(f=>f.concept.toLowerCase()).join(', ')}.`)}
  return parts.join(' ')}

/* ---------- gráficos ---------- */
let TIPS=[];
const tipA=h=>{TIPS.push(h);return `data-ti="${TIPS.length-1}" tabindex="0"`};
function niceTicks(mn,mx,n){if(mn===mx){mx=mn+1}const st0=(mx-mn)/n;const mag=Math.pow(10,Math.floor(Math.log10(st0)));const e=st0/mag;
  const st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st;const t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(Math.round(v*1e6)/1e6);return t}
function vbar(x,w,y0,y1,r){r=r??4;const h=Math.abs(y1-y0);if(h<.5)return '';r=Math.min(r,h,w/2);
  return y1<y0?`M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`
              :`M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`}
function hbar(y,h,x0,x1,r){r=r??4;const w=Math.abs(x1-x0);if(w<.5)return '';r=Math.min(r,w,h/2);
  return x1>x0?`M${x0},${y}H${x1-r}Q${x1},${y} ${x1},${y+r}V${y+h-r}Q${x1},${y+h} ${x1-r},${y+h}H${x0}Z`
              :`M${x0},${y}H${x1+r}Q${x1},${y} ${x1},${y+r}V${y+h-r}Q${x1},${y+h} ${x1+r},${y+h}H${x0}Z`}

function columnChart(items,label){
  const W=520,H=230,L=58,Rr=12,T=22,B=28,iw=W-L-Rr,ih=H-T-B;
  const vals=items.map(d=>d.value);const tk=niceTicks(Math.min(0,...vals),Math.max(0,...vals),4);const mn=tk[0],mx=tk[tk.length-1];
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;const band=iw/items.length;const bw=Math.min(34,band*.45);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  tk.forEach(t=>s+=`<line class="${t===0?'base':'grid'}" x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmtAxis(t)}</text>`);
  items.forEach((d,i)=>{const cx=L+band*i+band/2,last=i===items.length-1;
    s+=`<g class="hitcol"><rect class="hit" x="${L+band*i+2}" y="${T}" width="${band-4}" height="${ih}" rx="6" ${tipA(`<b>${d.label}</b><br>${esc(label)}: MM$ ${fmt(d.value)}${d.sub?'<br>'+d.sub:''}`)} ${d.attr||''}/>`+
      `<path class="${last?'bar':'bar-soft'}" d="${vbar(cx-bw/2,bw,y(0),y(d.value))}" pointer-events="none"/></g>`+
      `<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${d.label}</text>`;
    if(last)s+=`<text class="val" x="${cx}" y="${d.value>=0?y(d.value)-7:y(d.value)+15}" text-anchor="middle">${fmt(d.value)}</text>`});

function hBarChart(items,label,curY){

function lineChart(series,label,flags){

  for(let i=0;i<12;i++){const tip=`<b>${MONTHS_L[i]}</b><br>`+series.map(se=>`${se.name}: ${se.values[i]==null?'—':'MM$ '+fmt(se.values[i])}`).join('<br>')+(flags.includes(i)?'<br><b>Alerta de carga en este mes</b>':'');

      `<rect class="hit" x="${x(i)-iw/22}" y="${T}" width="${iw/11}" height="${ih}" ${tipA(tip)}/></g>`}

  return `<svg width="${W}" height="${H}" aria-hidden="true"><path d="${vals.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join('')}" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="var(--s1)"/></svg>`}

function renderExec(){
  const sc=S.scope;const st={};YEARS.forEach(y=>st[y]=ytd(sc,y));
  const comps=compsIn(sc);const flagged=comps.filter(c=>companyStatus(c)!=='ok');
  let h=crumbs();
  if(flagged.length)h+=`<div class="alertbar">${stHTML('serious','')}<span><b>${flagged.length} empresa(s)</b> con controles pendientes en esta vista: ${flagged.map(c=>esc(c.name)).join(', ')}. Sus cifras se muestran, marcadas, hasta que se revisen.</span><a data-tab="ctrl">Ver controles →</a></div>`;

const drawer=document.getElementById('drawer');let drawerCtx=null;

  drawerCtx={line,y:+y};const sc=S.scope;const cur=sumRange(sc,y,0,S.cut),prev=y>2022?sumRange(sc,y-1,0,S.cut):null;

    rows.map(r=>`<tr class="${r.attr?'clk':''}" ${r.attr||''}><td style="white-space:normal">${esc(r.n)}</td><td>${fmt(r.a)}</td>${prev?`<td>${fmt(r.b)}</td><td>${divbar(r.a-r.b,mx)} ${fmt(r.a-r.b)}</td>`:''}</tr>`).join('')+'</tbody></table></div></section>';
  /* mensual */
  const a=[],b=[];for(let m=0;m<12;m++){a.push(y===CUR&&m>=LASTCLOSE?null:sumRange(sc,y,m,m+1)[line]);b.push(y>2022?sumRange(sc,y-1,m,m+1)[line]:null)}
  const ids=new Set(compsIn(sc).map(c=>c.id));const flags=[...new Set(ANOMS.filter(x=>ids.has(x.c.id)&&x.y===y&&(x.hits.some(hh=>hh.l===line)||!BASE.includes(line))).map(x=>x.m))];
  h+=`<section><h3>Mes a mes</h3><div class="legend"><span><i style="background:var(--s1)"></i>${y}</span>${y>2022?`<span><i style="background:var(--s2)"></i>${y-1}</span>`:''}</div>${lineChart(y>2022?[{name:String(y),cls:'ln1',values:a},{name:String(y-1),cls:'ln2',values:b}]:[{name:String(y),cls:'ln1',values:a}],RN[line]+' mensual',flags)}</section>`;
  /* precio-volumen */

const tip=document.getElementById('tip');
function showTip(html,x,y){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,hh=tip.offsetHeight;tip.style.left=Math.min(x+14,innerWidth-w-8)+'px';tip.style.top=Math.min(y+14,innerHeight-hh-8)+'px'}

  const t=e.target.closest('[data-tab],[data-scope],[data-cell],[data-goto]');if(!t)return;
  if(t.dataset.goto){const [cid,l,y]=t.dataset.goto.split('|');S.tab='exec';S.scope={type:'company',id:cid};render();openDetail(l,+y);return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  if(t.dataset.scope){S.scope=parseScope(t.dataset.scope);if(t.dataset.gotab)S.tab=t.dataset.gotab;const keep=t.dataset.keep;render();if(keep){const [l,y]=keep.split('|');openDetail(l,+y)}return}
  if(t.dataset.cell){const [l,y]=t.dataset.cell.split('|');openDetail(l,+y)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-cell],[data-scope]')){e.preventDefault();e.target.click()}});

function simulateLoad(){
  const btn=document.getElementById('runLoad');btn.disabled=true;const log=document.getElementById('log');log.hidden=false;loadLog='';
  const now=new Date();const hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const steps=[];
  for(const e of Object.keys(ERPS)){const cs=COMPANIES.filter(c=>c.erp===e);steps.push(`${ERPS[e]}: leyendo ${cs.length} empresas (${ERP_SRC[e].toLowerCase()})… ${nf0.format(cs.length*(2400+Math.round(R()*900)))} movimientos`)}
  steps.push('Llevando cada cuenta a su línea común con la tabla de equivalencia…');
  steps.push('Revisando períodos completos y cargas duplicadas…');
  steps.push('Cuadrando cada empresa contra el mayor de su ERP…');
  steps.push('Comparando cada mes con el mismo mes de otros años…');
  const bad=COMPANIES.filter(c=>companyStatus(c)!=='ok');
  steps.push(bad.length?`Listo. ${16-bad.length} empresas cuadran; ${bad.length} quedan marcadas para revisión: ${bad.map(c=>c.name).join(', ')}.`:'Listo. Las 16 empresas cuadran.');
  let i=0;const tick=()=>{if(i>=steps.length){btn.disabled=false;for(const e in LOADS)LOADS[e]=now.toLocaleDateString('es-CL')+' '+hh;render();return}loadLog+=(loadLog?'\n':'')+steps[i++];log.textContent=loadLog;log.scrollTop=log.scrollHeight;setTimeout(tick,420)};tick()}

/* filtros */
(function init(){
  const fs=document.getElementById('fScope');
  fs.innerHTML=`<option value="group:grupo">Grupo consolidado</option>`+AREAS.map(a=>`<optgroup label="${a.name}"><option value="area:${a.id}">${a.name} (área)</option>${COMPANIES.filter(c=>c.area===a.id).map(c=>`<option value="company:${c.id}">${c.name}</option>`).join('')}</optgroup>`).join('');
  fs.onchange=e=>{S.scope=parseScope(e.target.value);S.tab='exec';render()};
  const fc=document.getElementById('fCut');fc.innerHTML=MONTHS.slice(0,LASTCLOSE).map((m,i)=>`<option value="${i+1}" ${i+1===S.cut?'selected':''}>Enero a ${MONTHS_L[i]}</option>`).join('');
  fc.onchange=e=>{S.cut=+e.target.value;render()};
  document.querySelectorAll('#fReal button').forEach(b=>b.onclick=()=>{S.real=b.dataset.v==='1';render()});
  document.querySelectorAll('#fElim button').forEach(b=>b.onclick=()=>{S.elim=b.dataset.v==='1';render()});
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('tab'))S.tab=q.get('tab');if(q.get('scope'))S.scope=parseScope(q.get('scope'));
  render();
  if(q.get('cell')){const [l,y]=q.get('cell').split('|');openDetail(l,+y)}
})();
</script>
